name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build module
        run: spacetime build -p ./module
      - name: Bindings are up to date
        run: |
          bash scripts/generate-bindings.sh
          git diff --exit-code -- packages/bindings || (echo "::error::Bindings are stale. Run pnpm generate and commit the result." && exit 1)
      - run: pnpm -r typecheck
      - run: pnpm --filter @mesa/console build

  predictor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/predictor
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
