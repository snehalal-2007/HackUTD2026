<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESA address block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Jaro&display=swap" rel="stylesheet">
<style>
/* Twelve takes on design 7 ("Address block") from location-designs.html: the block big, then the floor, then the site,
   set apart on the left of the alert. Same theme as the console. */
:root {
  --bg: #ebe8e2; --fg: #18181b; --card: #fff; --muted: #f5f3ef; --muted-fg: #5b5b63; --border: #e2dfd8;
  --ok: #2f9e6b; --warn: #d48806; --crit: #e5484d; --crit-ink: #b4232a; --warn-ink: #8a5a00; --r: 8px;
}
:root[data-theme="dark"] {
  --bg: #121214; --fg: #f4f4f5; --card: #1c1c1f; --muted: #26262a; --muted-fg: #a1a1aa; --border: #2a2a2e;
  --ok: #3fb67f; --warn: #e59a1a; --crit: #f2555a; --crit-ink: #ff8a8e; --warn-ink: #f2bd5c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Lexend', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
header.page { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 18px 28px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { font-family: 'Jaro', sans-serif; font-size: 30px; line-height: 1; }
header.page p { margin: 0; color: var(--muted-fg); font-size: 14px; }
.toggle { margin-left: auto; display: inline-flex; padding: 3px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); }
.toggle button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--muted-fg); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
main { max-width: 1400px; margin: 0 auto; padding: 22px 28px 60px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
.design { border: 1px dashed var(--border); border-radius: 12px; padding: 16px; background: color-mix(in srgb, var(--card) 40%, transparent); }
.design h2 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.design h2 .n { font-size: 12px; font-weight: 700; background: var(--fg); color: var(--bg); border-radius: 6px; padding: 2px 7px; }
.design .note { margin: 0 0 12px; font-size: 12.5px; color: var(--muted-fg); }
.stack { display: grid; gap: 8px; }

.card { background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: 0 1px 2px rgba(24,24,27,.06); display: flex; gap: 14px; align-items: flex-start; }
.body { min-width: 0; flex: 1; }
.tags { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 5px; }
.sev { font-weight: 600; font-size: 13px; color: var(--c); }
.badge { border-radius: 6px; padding: 1px 6px; font-size: 11.5px; font-weight: 500; background: color-mix(in srgb, var(--c) 12%, var(--card)); color: var(--ink); }
.ago { margin-left: auto; color: var(--muted-fg); }
.what { font-size: 15px; font-weight: 600; line-height: 1.35; }
.what small { font-weight: 500; color: var(--muted-fg); font-size: 13px; }
.sub { color: var(--muted-fg); font-size: 12.5px; margin-top: 3px; }
.crit { --c: var(--crit); --ink: var(--crit-ink); }
.warn { --c: var(--warn); --ink: var(--warn-ink); }

/* the address column, shared */
.addr { flex: none; min-width: 72px; }
.addr .b { font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.addr .f { font-size: 12.5px; font-weight: 600; margin-top: 5px; }
.addr .s { font-size: 11.5px; color: var(--muted-fg); }

/* 1 classic: divider line */
.v1 .addr { border-right: 1px solid var(--border); padding-right: 14px; }
/* 2 block in status colour */
.v2 .addr { border-right: 1px solid var(--border); padding-right: 14px; }
.v2 .addr .b { color: var(--c); }
/* 3 tinted panel */
.v3.card { padding: 0; overflow: hidden; gap: 0; }
.v3 .addr { background: color-mix(in srgb, var(--c) 10%, var(--card)); padding: 14px 16px; align-self: stretch; }
.v3 .addr .b { color: var(--ink); }
.v3 .body { padding: 14px 16px; }
/* 4 grey panel, status dot */
.v4.card { padding: 0; overflow: hidden; gap: 0; }
.v4 .addr { background: var(--muted); padding: 14px 16px; align-self: stretch; }
.v4 .addr .b { display: flex; align-items: center; gap: 7px; }
.v4 .addr .b::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.v4 .body { padding: 14px 16px; }
/* 5 ink panel */
.v5.card { padding: 0; overflow: hidden; gap: 0; }
.v5 .addr { background: var(--fg); color: var(--bg); padding: 14px 16px; align-self: stretch; }
.v5 .addr .s { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.v5 .body { padding: 14px 16px; }
/* 6 labelled rows */
.v6 .addr { border-right: 1px solid var(--border); padding-right: 14px; min-width: 96px; }
.v6 .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; font-size: 12px; align-items: baseline; }
.v6 .kv dt { color: var(--muted-fg); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.v6 .kv dd { margin: 0; font-weight: 600; }
.v6 .kv dd.big { font-size: 20px; font-weight: 700; }
/* 7 with mini floor map */
.v7 .addr { border-right: 1px solid var(--border); padding-right: 14px; }
.mini { display: grid; grid-template-columns: repeat(3, 10px); gap: 2px; margin-top: 7px; }
.mini i { width: 10px; height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--muted-fg) 22%, transparent); }
.mini i.on { background: var(--c); }
/* 8 with floor ladder */
.v8 .addr { border-right: 1px solid var(--border); padding-right: 14px; display: flex; gap: 10px; align-items: flex-start; min-width: 92px; }
.ladder { display: flex; flex-direction: column-reverse; gap: 3px; margin-top: 3px; }
.ladder i { width: 8px; height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--muted-fg) 22%, transparent); }
.ladder i.on { background: var(--fg); }
/* 9 big code */
.v9 .addr { border-right: 1px solid var(--border); padding-right: 14px; }
.v9 .addr .b { font-family: 'JetBrains Mono', monospace; font-size: 24px; }
.v9 .addr .f { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg); font-weight: 500; }
/* 10 rounded tile */
.v10 .addr { background: var(--muted); border-radius: 10px; padding: 10px 12px; text-align: center; min-width: 76px; }
.v10 .addr .b { font-size: 24px; }
/* 11 status bar under block */
.v11 .addr { border-right: 1px solid var(--border); padding-right: 14px; }
.v11 .addr .b { display: inline-block; padding-bottom: 4px; border-bottom: 3px solid var(--c); }
/* 12 compact inline address */
.v12.card { flex-direction: column; gap: 8px; }
.v12 .addr { display: flex; align-items: baseline; gap: 8px; min-width: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; width: 100%; }
.v12 .addr .b { font-size: 22px; }
.v12 .addr .f, .v12 .addr .s { margin: 0; }
.v12 .addr .sep { color: var(--muted-fg); }
.v12 .tags { margin: 0 0 0 auto; }

@media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 16px; } header.page { padding: 14px 16px; } }
</style>
</head>
<body>
<header class="page">
  <span class="brand">mesa</span>
  <p>Address block · 12 takes on design 7 · each shown critical and high · pick a number</p>
  <div class="toggle" role="group" aria-label="Theme"><button type="button" data-t="light" aria-pressed="true">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div>
</header>
<main id="grid"></main>

<script>
const ALERTS = [
  { k: 'crit', sev: 'Critical', st: 'Escalated', ago: '12m ago', block: 'A1', idx: 0, floor: 1, site: 'Spartanburg', what: 'GPU at 56.8 °C <small>(limit 55 °C)</small>', sub: 'Opened at 57 °C · still rising' },
  { k: 'warn', sev: 'High', st: 'Open', ago: '4m ago', block: 'E3', idx: 2, floor: 3, site: 'Spartanburg', what: 'GPU at 51.2 °C <small>(limit 50 °C)</small>', sub: 'Opened at 50.4 °C · nobody on it yet' },
]
const head = a => `<div class="tags"><span class="sev">${a.sev}</span><span class="badge">${a.st}</span><span class="ago">${a.ago}</span></div>`
const body = a => `<div class="body">${head(a)}<div class="what">${a.what}</div><div class="sub">${a.sub}</div></div>`
const addr = a => `<div class="addr"><div class="b">${a.block}</div><div class="f">Floor ${a.floor}</div><div class="s">${a.site}</div></div>`
const mini = a => `<div class="mini">${[0,1,2,3,4,5].map(i => `<i class="${i === a.idx + (a.block[0] === 'B' ? 3 : 0) ? 'on' : ''}"></i>`).join('')}</div>`

const V = [
  ['Classic', 'The original: block, floor, site stacked, a thin line between address and alert.', a => `<div class="card v1 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Status-coloured block', 'Same, but the block name takes the severity colour, so the eye goes there first.', a => `<div class="card v2 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Tinted panel', 'The address sits in a softly tinted panel in the status colour, full height of the card.', a => `<div class="card v3 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Grey panel + dot', 'A neutral grey panel with a status dot by the block: calmer, colour only where it matters.', a => `<div class="card v4 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Ink panel', 'A dark panel for the address (light in dark mode): the strongest, most “label-like”.', a => `<div class="card v5 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Labelled rows', 'Small BLOCK / FLOOR / SITE labels, so a new operator never has to guess what each line is.', a => `<div class="card v6 ${a.k}"><div class="addr"><dl class="kv"><dt>Block</dt><dd class="big">${a.block}</dd><dt>Floor</dt><dd>${a.floor}</dd><dt>Site</dt><dd>${a.site}</dd></dl></div>${body(a)}</div>`],
  ['With floor map', 'Adds a tiny map of the floor’s six blocks with this one lit, under the address.', a => `<div class="card v7 ${a.k}"><div class="addr"><div class="b">${a.block}</div><div class="f">Floor ${a.floor}</div><div class="s">${a.site}</div>${mini(a)}</div>${body(a)}</div>`],
  ['With floor ladder', 'A little stack of the site’s floors beside the block, this floor filled.', a => `<div class="card v8 ${a.k}"><div class="addr"><div class="ladder">${[1,2,3].map(f => `<i class="${f === a.floor ? 'on' : ''}"></i>`).join('')}</div><div><div class="b">${a.block}</div><div class="f">Floor ${a.floor}</div><div class="s">${a.site}</div></div></div>${body(a)}</div>`],
  ['Rack-label type', 'Monospace like the label printed on the rack: A1, then FLOOR 1 in small caps.', a => `<div class="card v9 ${a.k}"><div class="addr"><div class="b">${a.block}</div><div class="f">Floor ${a.floor}</div><div class="s">${a.site}</div></div>${body(a)}</div>`],
  ['Rounded tile', 'The address centred in a soft rounded tile, like a key on a keyboard.', a => `<div class="card v10 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Underlined block', 'A short bar in the status colour under the block name: colour without filling anything.', a => `<div class="card v11 ${a.k}">${addr(a)}${body(a)}</div>`],
  ['Address on top', 'The same hierarchy laid out across the top (A1 · Floor 1 · Spartanburg), alert underneath. Fits narrow columns.', a => `<div class="card v12 ${a.k}"><div class="addr"><span class="b">${a.block}</span><span class="f">Floor ${a.floor}</span><span class="sep">·</span><span class="s">${a.site}</span>${head(a)}</div><div class="body"><div class="what">${a.what}</div><div class="sub">${a.sub}</div></div></div>`],
]

document.getElementById('grid').innerHTML = V.map(([name, note, make], i) => `
  <section class="design" aria-label="Design ${i + 1}: ${name}">
    <h2><span class="n">${i + 1}</span>${name}</h2>
    <p class="note">${note}</p>
    <div class="stack">${ALERTS.map(make).join('')}</div>
  </section>`).join('')

document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.t
  document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
}))
</script>
</body>
</html>
