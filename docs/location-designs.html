<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESA location styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Jaro&display=swap" rel="stylesheet">
<style>
/* Ways to say WHERE something is (site → floor → block) instead of "Spartanburg · Floor 1 · blocks A1–A3".
   Same theme as the console (apps/console/src/index.css): warm grey page, white cards, Lexend, 8px radius. */
:root {
  --bg: #ebe8e2; --fg: #18181b; --card: #fff; --muted: #f5f3ef; --muted-fg: #5b5b63; --border: #e2dfd8;
  --ok: #2f9e6b; --warn: #d48806; --crit: #e5484d; --crit-ink: #b4232a; --r: 8px;
}
:root[data-theme="dark"] {
  --bg: #121214; --fg: #f4f4f5; --card: #1c1c1f; --muted: #26262a; --muted-fg: #a1a1aa; --border: #2a2a2e;
  --ok: #3fb67f; --warn: #e59a1a; --crit: #f2555a; --crit-ink: #ff8a8e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Lexend', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
header.page { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 18px 28px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { font-family: 'Jaro', sans-serif; font-size: 30px; line-height: 1; }
header.page p { margin: 0; color: var(--muted-fg); font-size: 14px; }
.toggle { margin-left: auto; display: inline-flex; padding: 3px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); }
.toggle button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--muted-fg); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.before { max-width: 1400px; margin: 20px auto 0; padding: 0 28px; }
.before .lab { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--crit-ink); margin-bottom: 6px; }
main { max-width: 1400px; margin: 0 auto; padding: 20px 28px 60px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
.design { border: 1px dashed var(--border); border-radius: 12px; padding: 16px; background: color-mix(in srgb, var(--card) 40%, transparent); }
.design h2 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.design h2 .n { font-size: 12px; font-weight: 700; background: var(--fg); color: var(--bg); border-radius: 6px; padding: 2px 7px; }
.design .note { margin: 0 0 12px; font-size: 12.5px; color: var(--muted-fg); }

/* the alert card every design sits in */
.card { background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: 0 1px 2px rgba(24,24,27,.06); }
.tags { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
.sev { color: var(--crit); font-weight: 600; font-size: 13px; }
.badge { border-radius: 6px; padding: 1px 6px; font-size: 11.5px; font-weight: 500; background: color-mix(in srgb, var(--crit) 12%, var(--card)); color: var(--crit-ink); }
.ago { margin-left: auto; color: var(--muted-fg); }
.what { font-size: 15px; font-weight: 600; line-height: 1.35; }
.what small { font-weight: 500; color: var(--muted-fg); font-size: 13px; }
.sub { color: var(--muted-fg); font-size: 12.5px; margin-top: 3px; }
svg.i { width: 14px; height: 14px; flex: none; }

/* 1 block chip first */
.d1 .row { display: flex; gap: 12px; align-items: center; }
.d1 .chip { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: color-mix(in srgb, var(--crit) 12%, var(--card)); color: var(--crit-ink); font-weight: 700; font-size: 16px; }
/* 2 breadcrumb */
.crumb { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted-fg); margin-bottom: 6px; }
.crumb b { color: var(--fg); font-weight: 600; }
.crumb .sep { opacity: .5; }
/* 3 segmented pill */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; font-size: 12.5px; margin-top: 8px; }
.seg span { padding: 3px 10px; }
.seg span + span { border-left: 1px solid var(--border); }
.seg span:last-child { background: var(--fg); color: var(--bg); font-weight: 600; }
/* 4 icon tags */
.itags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.itags span { display: inline-flex; align-items: center; gap: 5px; background: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; }
.itags span.blk { background: var(--fg); color: var(--bg); font-weight: 600; }
/* 5 location code */
.code { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; background: var(--muted); border-radius: 6px; padding: 2px 8px; letter-spacing: .02em; }
/* 6 mini floor map */
.d6 .row { display: flex; gap: 14px; align-items: center; }
.mini { flex: none; display: grid; grid-template-columns: repeat(3, 14px); gap: 3px; padding: 6px; background: var(--muted); border-radius: 8px; }
.mini i { width: 14px; height: 11px; border-radius: 2px; background: color-mix(in srgb, var(--muted-fg) 22%, transparent); }
.mini i.on { background: var(--crit); }
.mini-cap { font-size: 11px; color: var(--muted-fg); text-align: center; margin-top: 3px; }
/* 7 type hierarchy */
.d7 .row { display: flex; gap: 14px; align-items: flex-start; }
.addr { flex: none; min-width: 74px; border-right: 1px solid var(--border); padding-right: 14px; }
.addr .b { font-size: 24px; font-weight: 700; line-height: 1; }
.addr .f { font-size: 12.5px; font-weight: 600; margin-top: 4px; }
.addr .s { font-size: 11.5px; color: var(--muted-fg); }
/* 8 icon row */
.irow { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted-fg); margin-top: 8px; }
.irow span { display: inline-flex; align-items: center; gap: 5px; }
.irow b { color: var(--fg); }
/* 9 grouped */
.group h3 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); display: flex; justify-content: space-between; }
.group .card + .card { margin-top: 6px; }
.blkname { font-weight: 700; }
/* 10 status avatar */
.d10 .row { display: flex; gap: 12px; align-items: center; }
.ava { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--crit); color: #fff; font-weight: 700; font-size: 14px; }
/* 11 what / where */
.where { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 13px; color: var(--muted-fg); }
.where b { color: var(--fg); font-weight: 600; }
/* 12 floor ladder */
.d12 .row { display: flex; gap: 14px; align-items: center; }
.ladder { flex: none; display: flex; flex-direction: column-reverse; gap: 3px; }
.ladder i { width: 34px; height: 9px; border-radius: 3px; background: color-mix(in srgb, var(--muted-fg) 22%, transparent); }
.ladder i.on { background: var(--fg); }
.ladcap { font-size: 11px; color: var(--muted-fg); margin-top: 4px; }

@media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 16px; } header.page, .before { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header class="page">
  <span class="brand">mesa</span>
  <p>Location styles · 12 ways to say where something is · pick a number</p>
  <div class="toggle" role="group" aria-label="Theme"><button type="button" data-t="light" aria-pressed="true">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div>
</header>

<div class="before">
  <div class="lab">Today</div>
  <div class="card" style="max-width:520px">
    <div class="tags"><span class="sev">Critical</span><span class="badge">Escalated</span><span class="ago">12m ago</span></div>
    <div class="what">Spartanburg · Floor 1 · blocks A1–A3: GPU at 56.8 °C (limit 55 °C)</div>
    <div class="sub">Spartanburg · Floor 1 · blocks A1–A3 · opened at 57 °C</div>
  </div>
</div>

<main id="grid"></main>

<script>
const I = {
  pin: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  layers: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
  box: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg>',
  building: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>',
  chev: '<span class="sep">›</span>',
}
const T = '<div class="tags"><span class="sev">Critical</span><span class="badge">Escalated</span><span class="ago">12m ago</span></div>'
const WHAT = 'GPU at 56.8 °C <small>(limit 55 °C)</small>'

const D = [
  ['Block chip first', 'The block is the thing you go to: a big tinted chip, the rest in small grey text.',
   `<div class="card d1">${T}<div class="row"><span class="chip">A1</span><div><div class="what">${WHAT}</div><div class="sub">Floor 1 · Spartanburg</div></div></div></div>`],
  ['Breadcrumb', 'Site › Floor › Block above the title, like a file path. The last step is bold.',
   `<div class="card">${T}<div class="crumb">Spartanburg ${I.chev} Floor 1 ${I.chev} <b>Block A1</b></div><div class="what">${WHAT}</div></div>`],
  ['Segmented pill', 'One joined pill; the block segment is filled so the eye lands there.',
   `<div class="card">${T}<div class="what">${WHAT}</div><div class="seg"><span>Spartanburg</span><span>Floor 1</span><span>A1</span></div></div>`],
  ['Icon tags', 'Three small tags with icons (site, floor, block). Easy to scan in a long list.',
   `<div class="card">${T}<div class="what">${WHAT}</div><div class="itags"><span>${I.pin}Spartanburg</span><span>${I.layers}Floor 1</span><span class="blk">${I.box}A1</span></div></div>`],
  ['Location code', 'A short code like a label on the rack: SPT-1-A1. Hover shows it spelled out.',
   `<div class="card">${T}<div class="what">${WHAT}</div><div class="sub" style="margin-top:8px"><span class="code" title="Spartanburg, Floor 1, Block A1">SPT-1-A1</span> &nbsp;Spartanburg, Floor 1</div></div>`],
  ['Mini floor map', 'A tiny map of the floor with the block lit up: you see where it sits, not just its name.',
   `<div class="card d6">${T}<div class="row"><div><div class="mini"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div class="mini-cap">Floor 1</div></div><div><div class="what">Block A1 · ${WHAT}</div><div class="sub">Spartanburg</div></div></div></div>`],
  ['Address block', 'Like a mailing address, biggest to smallest: block, floor, site, set apart on the left.',
   `<div class="card d7">${T}<div class="row"><div class="addr"><div class="b">A1</div><div class="f">Floor 1</div><div class="s">Spartanburg</div></div><div><div class="what">${WHAT}</div><div class="sub">Opened at 57 °C · rising</div></div></div></div>`],
  ['Icon row', 'One quiet line under the title, but each part has an icon so it reads as three facts.',
   `<div class="card">${T}<div class="what">${WHAT}</div><div class="irow"><span>${I.building}<b>Spartanburg</b></span><span>${I.layers}Floor <b>1</b></span><span>${I.box}Block <b>A1</b></span></div></div>`],
  ['Grouped by place', 'The list is grouped under site + floor headers, so each card only needs the block.',
   `<div class="group"><h3><span>Spartanburg · Floor 1</span><span>2 alerts</span></h3><div class="card">${T}<div class="what"><span class="blkname">A1</span> · ${WHAT}</div></div><div class="card"><div class="tags"><span class="sev" style="color:var(--warn)">High</span><span class="ago">4m ago</span></div><div class="what"><span class="blkname">B3</span> · GPU at 51.2 °C <small>(limit 50 °C)</small></div></div></div>`],
  ['Status avatar', 'The block as a round avatar in the status colour, like a person in a chat list.',
   `<div class="card d10">${T}<div class="row"><span class="ava">A1</span><div><div class="what">${WHAT}</div><div class="sub">Floor 1 · Spartanburg</div></div></div></div>`],
  ['What, then where', 'Title says what happened; a single “where” line with a pin says Block A1, Floor 1, Spartanburg.',
   `<div class="card">${T}<div class="what">${WHAT}</div><div class="where">${I.pin}<b>Block A1</b>, Floor 1, Spartanburg</div></div>`],
  ['Floor ladder', 'A small stack of floors with this one filled, so “Floor 1 of 3” is visible at a glance.',
   `<div class="card d12">${T}<div class="row"><div><div class="ladder"><i class="on"></i><i></i><i></i></div><div class="ladcap">1 of 3</div></div><div><div class="what">Block A1 · ${WHAT}</div><div class="sub">Spartanburg</div></div></div></div>`],
]

document.getElementById('grid').innerHTML = D.map(([name, note, html], i) => `
  <section class="design" aria-label="Design ${i + 1}: ${name}">
    <h2><span class="n">${i + 1}</span>${name}</h2>
    <p class="note">${note}</p>
    ${html}
  </section>`).join('')

document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.t
  document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
}))
</script>
</body>
</html>
