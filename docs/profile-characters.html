<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESA profile characters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Jaro&display=swap" rel="stylesheet">
<style>
/* Generated from apps/console/src/components/shell/character-avatar.tsx: the console draws exactly these.
   Each operator gets one, picked from their identity (characterFor in character-parts.ts), so it never changes. */
:root { --bg:#ebe8e2; --fg:#18181b; --card:#fff; --muted-fg:#5b5b63; --border:#e2dfd8; }
:root[data-theme="dark"] { --bg:#121214; --fg:#f4f4f5; --card:#1c1c1f; --muted-fg:#a1a1aa; --border:#2a2a2e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:'Lexend',system-ui,sans-serif; }
header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding:18px 28px; background:var(--bg); border-bottom:1px solid var(--border); }
.brand { font-family:'Jaro',sans-serif; font-size:30px; line-height:1; }
header p { margin:0; color:var(--muted-fg); font-size:14px; }
.toggle { margin-left:auto; display:inline-flex; padding:3px; border-radius:10px; background:var(--card); border:1px solid var(--border); }
.toggle button { font:inherit; font-size:13px; font-weight:600; border:0; background:none; color:var(--muted-fg); padding:6px 12px; border-radius:7px; cursor:pointer; }
.toggle button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
main { max-width:1400px; margin:0 auto; padding:24px 28px 40px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
.c { margin:0; background:var(--card); border-radius:12px; padding:16px 12px 12px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.pic svg { display:block; }
figcaption { text-align:center; display:flex; flex-direction:column; gap:2px; }
figcaption b { font-size:14px; }
figcaption span { font-size:12px; color:var(--muted-fg); }
section.inuse { max-width:1400px; margin:0 auto; padding:0 28px 48px; }
section.inuse h2 { font-size:15px; margin:0 0 10px; }
.row { display:flex; flex-wrap:wrap; gap:10px; }
.chip { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:999px; padding:6px 14px 6px 6px; font-size:14px; font-weight:600; }
.chip svg { width:34px; height:34px; }
@media (max-width:520px) { main { padding:16px; grid-template-columns:repeat(2,1fr); } header { padding:14px 16px; } }
</style>
</head>
