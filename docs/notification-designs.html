<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESA notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Jaro&display=swap" rel="stylesheet">
<style>
/* MESA console theme (apps/console/src/index.css): warm grey page, white cards, near-black ink, Lexend, 8px radius. */
:root {
  --bg: #ebe8e2; --fg: #18181b; --card: #ffffff; --muted: #f5f3ef; --muted-fg: #5b5b63; --border: #e2dfd8;
  --ok: #2f9e6b; --ok-ink: #1d6b47; --warn: #d48806; --warn-ink: #8a5a00; --crit: #e5484d; --crit-ink: #b4232a;
  --shadow: 0 10px 30px rgba(24,24,27,.10), 0 2px 6px rgba(24,24,27,.05);
  --r: 8px;
}
:root[data-theme="dark"] {
  --bg: #121214; --fg: #f4f4f5; --card: #1c1c1f; --muted: #26262a; --muted-fg: #a1a1aa; --border: #2a2a2e;
  --ok: #3fb67f; --ok-ink: #6fd3a3; --warn: #e59a1a; --warn-ink: #f2bd5c; --crit: #f2555a; --crit-ink: #ff8a8e;
  --shadow: 0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Lexend', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
header.page { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 18px 28px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { font-family: 'Jaro', sans-serif; font-size: 30px; line-height: 1; }
header.page p { margin: 0; color: var(--muted-fg); font-size: 14px; }
.toggle { margin-left: auto; display: inline-flex; padding: 3px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); }
.toggle button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--muted-fg); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
main { padding: 24px 28px 60px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); max-width: 1500px; margin: 0 auto; }
.design { background: color-mix(in srgb, var(--card) 45%, transparent); border: 1px dashed var(--border); border-radius: 12px; padding: 16px 16px 20px; }
.design h2 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.design h2 .n { font-size: 12px; font-weight: 700; background: var(--fg); color: var(--bg); border-radius: 6px; padding: 2px 7px; }
.design .note { margin: 0 0 14px; font-size: 12.5px; color: var(--muted-fg); }
.stack { display: grid; gap: 10px; }

/* shared bits */
.t { width: 100%; max-width: 380px; font-size: 14px; }
.title { font-weight: 600; font-size: 14px; line-height: 1.3; }
.desc { color: var(--muted-fg); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
.meta { color: var(--muted-fg); font-size: 11.5px; margin-top: 4px; }
.x { margin-left: auto; align-self: flex-start; border: 0; background: none; color: var(--muted-fg); cursor: pointer; padding: 0 0 0 6px; font-size: 16px; line-height: 1; }
.btn { font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 5px 10px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--fg); white-space: nowrap; }
.btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.ico { width: 18px; height: 18px; flex: none; }
.row { display: flex; gap: 10px; align-items: flex-start; }
.tone-ok { --c: var(--ok); --ink: var(--ok-ink); }
.tone-warn { --c: var(--warn); --ink: var(--warn-ink); }
.tone-crit { --c: var(--crit); --ink: var(--crit-ink); }
.word { color: var(--ink); font-weight: 600; }

/* 1 severity strip (Security feed) */
.d1 { border-radius: var(--r); padding-left: 8px; background: color-mix(in srgb, var(--c) 65%, transparent); box-shadow: var(--shadow); }
.d1 > .in { border-radius: var(--r); background: var(--card); padding: 11px 13px; display: flex; gap: 10px; }

/* 2 white card, coloured icon circle */
.d2 { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
.d2 .bub { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }

/* 3 soft tint */
.d3 { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: color-mix(in srgb, var(--c) 11%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); color: var(--fg); }
.d3 .ico { color: var(--c); }

/* 4 countdown bar */
.d4 { position: relative; overflow: hidden; padding: 12px 14px 15px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); display: flex; gap: 10px; }
.d4 .ico { color: var(--c); }
.d4::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 64%; background: var(--c); border-radius: 0 3px 3px 0; animation: drain 6s linear infinite; }
@keyframes drain { from { width: 100%; } to { width: 0; } }

/* 5 capsule */
.d5 { display: inline-flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; max-width: 380px; }
.d5 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.d5 .btn { border-radius: 999px; padding: 3px 10px; }

/* 6 ink card (inverse) */
.d6 { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--fg); color: var(--bg); box-shadow: var(--shadow); }
.d6 .desc, .d6 .x { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.d6 .ico { color: var(--c); }
.d6 .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 30%, transparent); }

/* 7 icon block */
.d7 { display: flex; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
.d7 .blk { width: 46px; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; }
.d7 .body { padding: 11px 13px; display: flex; gap: 8px; flex: 1; min-width: 0; }

/* 8 outline + glyph label */
.d8 { padding: 11px 13px; border-radius: var(--r); background: var(--card); border: 1.5px solid var(--c); }
.d8 .lab { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }

/* 9 folder tab (floor tabs) */
.d9 { position: relative; padding-top: 24px; }
.d9 .tab { position: absolute; top: 0; left: 0; height: 26px; padding: 4px 12px 0; border-radius: var(--r) var(--r) 0 0; background: var(--card); font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; color: var(--ink); }
.d9 .tab i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.d9 .card { border-radius: 0 var(--r) var(--r) var(--r); background: var(--card); padding: 11px 13px; box-shadow: var(--shadow); display: flex; gap: 8px; }

/* 10 status pill header (StatusPill) */
.d10 { padding: 12px 14px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
.d10 .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; color: var(--ink); }
.d10 .time { margin-left: auto; font-size: 11.5px; color: var(--muted-fg); }

/* 11 bottom accent */
.d11 { padding: 12px 14px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); border-bottom: 3px solid var(--c); display: flex; gap: 10px; }
.d11 .ico { color: var(--c); }

/* 12 full detail with actions */
.d12 { border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
.d12 .hd { display: flex; align-items: center; gap: 8px; padding: 8px 13px; background: color-mix(in srgb, var(--c) 12%, var(--card)); font-size: 12px; font-weight: 600; color: var(--ink); }
.d12 .hd .time { margin-left: auto; color: var(--muted-fg); font-weight: 500; }
.d12 .bd { padding: 11px 13px 12px; }
.d12 dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 9px 0 10px; }
.d12 dl div { background: var(--muted); border-radius: 6px; padding: 5px 8px; }
.d12 dt { font-size: 10.5px; color: var(--muted-fg); }
.d12 dd { margin: 0; font-size: 13px; font-weight: 600; }
.d12 .acts { display: flex; gap: 6px; justify-content: flex-end; }

@media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 16px; } header.page { padding: 14px 16px; } }
</style>
</head>
<body>
<header class="page">
  <span class="brand">mesa</span>
  <p>Notification designs · green, yellow, red · pick a number</p>
  <div class="toggle" role="group" aria-label="Theme">
    <button type="button" data-t="light" aria-pressed="true">Light</button>
    <button type="button" data-t="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main id="grid"></main>

<script>
const ICON = {
  ok: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>',
  warn: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  crit: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 2.5h8.2l5.4 5.4v8.2l-5.4 5.4H7.9l-5.4-5.4V7.9Z"/><path d="M12 8v4.5M12 16h.01"/></svg>',
}
const GLYPH = { ok: '●', warn: '▲', crit: '◆' }
const WORD = { ok: 'Resolved', warn: 'Warning', crit: 'Critical' }
const N = {
  ok:   { title: 'Task #66 resolved', desc: 'Spartanburg · Floor 1 · blocks A1–A3 is back under 50 °C.', block: 'A1–A3', temp: '48.6 °C', who: 'You', act: 'View in Log' },
  warn: { title: 'Blocks E1–E3 crossed 50 °C', desc: 'GPU at 51.2 °C (limit 50 °C) · Spartanburg · Floor 3', block: 'E1–E3', temp: '51.2 °C', who: 'Unassigned', act: 'Take task' },
  crit: { title: 'Blocks A1–A3 over the critical limit', desc: 'GPU at 56.8 °C (limit 55 °C) · Spartanburg · Floor 1', block: 'A1–A3', temp: '56.8 °C', who: 'Priya', act: 'Take task' },
}
const X = '<button class="x" aria-label="Dismiss">×</button>'

const DESIGNS = [
  ['Severity strip', 'The Security feed card: a coloured strip peeking out on the left.', k => `<div class="t d1 tone-${k}"><div class="in">${ICON[k].replace('class="ico"','class="ico" style="color:var(--c)"')}<div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div></div>`],
  ['Icon bubble', 'White card, the status icon in a soft circle.', k => `<div class="t d2 tone-${k}"><span class="bub">${ICON[k]}</span><div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div>`],
  ['Soft tint', 'The whole card washed in the status colour.', k => `<div class="t d3 tone-${k}">${ICON[k]}<div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div>`],
  ['Countdown bar', 'A thin bar drains until the notification closes itself.', k => `<div class="t d4 tone-${k}">${ICON[k]}<div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div>`],
  ['Capsule', 'One line, with a single action. Least in the way.', k => `<div class="d5 tone-${k}"><span class="dot"></span><span><b class="word">${WORD[k]}</b> · ${N[k].title}</span><button class="btn">${N[k].act}</button></div>`],
  ['Ink card', 'Near-black card in light mode (white in dark): stands out most.', k => `<div class="t d6 tone-${k}">${ICON[k]}<div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div><button class="btn">${N[k].act}</button></div>`],
  ['Icon block', 'A solid status block down the left edge.', k => `<div class="t d7 tone-${k}"><span class="blk">${ICON[k]}</span><div class="body"><div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div></div>`],
  ['Outline + label', 'Coloured border with the status written above the title.', k => `<div class="t d8 tone-${k}"><div class="lab">${GLYPH[k]} ${WORD[k]}</div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>`],
  ['Folder tab', 'Like the Floor page tabs: the status sits on a tab above the card.', k => `<div class="t d9 tone-${k}"><span class="tab"><i></i>${WORD[k]}</span><div class="card"><div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div></div>`],
  ['Status pill', 'The block panel’s ◆ Critical pill, with the time on the right.', k => `<div class="t d10 tone-${k}"><div class="top"><span class="pill">${GLYPH[k]} ${WORD[k]}</span><span class="time">just now</span></div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>`],
  ['Bottom accent', 'A plain card with a coloured underline.', k => `<div class="t d11 tone-${k}">${ICON[k]}<div><div class="title">${N[k].title}</div><div class="desc">${N[k].desc}</div></div>${X}</div>`],
  ['Full detail', 'Block, temperature and owner at a glance, with two actions.', k => `<div class="t d12 tone-${k}"><div class="hd">${GLYPH[k]} ${WORD[k]}<span class="time">just now</span></div><div class="bd"><div class="title">${N[k].title}</div><dl><div><dt>Blocks</dt><dd>${N[k].block}</dd></div><div><dt>Hottest GPU</dt><dd>${N[k].temp}</dd></div><div><dt>Owner</dt><dd>${N[k].who}</dd></div></dl><div class="acts"><button class="btn">View in Log</button>${k === 'ok' ? '' : `<button class="btn solid">${N[k].act}</button>`}</div></div></div>`],
]

document.getElementById('grid').innerHTML = DESIGNS.map(([name, note, make], i) => `
  <section class="design" aria-label="Design ${i + 1}: ${name}">
    <h2><span class="n">${i + 1}</span>${name}</h2>
    <p class="note">${note}</p>
    <div class="stack">${['ok', 'warn', 'crit'].map(make).join('')}</div>
  </section>`).join('')

document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.t
  document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
}))
</script>
</body>
</html>
